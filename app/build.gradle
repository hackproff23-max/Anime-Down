plugins {
    id 'com.android.application'
}

android {
    namespace 'com.animedown.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.animedown.app'
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "2.0"
    }

    signingConfigs {
        release {
            storeFile file("${rootProject.projectDir}/keystore/animedown.jks")
            storePassword 'animedown123'
            keyAlias 'animedown'
            keyPassword 'animedown123'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}
